<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YouTube Active Watch Time</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <p class="eyebrow">ACTIVE WATCH TIME</p>
    <h1 id="today">0m</h1>
    <p class="subtitle">Today</p>

    <section>
      <h2>Last 7 days</h2>
      <ol id="history"></ol>
    </section>

    <p class="rule">Counts visible, advancing video. Excludes pause, buffering, background tabs and PiP.</p>
    <button id="resetToday" type="button">Reset today</button>
  </main>
  <script src="popup.js"></script>
</body>
</html>
